name: Build extension

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Verify extension files
        run: |
          test -f dist/manifest.json
          test -f dist/background.js
          test -f dist/content.js
          test -f dist/index.html
          test -f dist/icons/sourceclip-16.png
          test -f dist/icons/sourceclip-32.png
          test -f dist/icons/sourceclip-48.png
          test -f dist/icons/sourceclip-128.png
          test "$(find dist/assets -type f -name '*.woff2' | wc -l)" -ge 2
